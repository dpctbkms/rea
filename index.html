<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Rea Chart</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <select id="source" class="select source" aria-label="거래소"></select>
      <button id="symbol-btn" class="symbol-btn" title="심볼 검색 (아무 글자나 입력)">
        <span id="symbol-label">BTCUSDT</span>
      </button>
      <div class="divider"></div>
      <div id="intervals" class="group" role="group" aria-label="타임프레임"></div>
      <div class="divider"></div>
      <select id="chart-type" class="select" aria-label="차트 종류">
        <option value="candles">캔들</option>
        <option value="heikin">하이킨아시</option>
        <option value="bars">바</option>
        <option value="line">라인</option>
        <option value="area">영역</option>
      </select>
      <div class="menu">
        <button id="indicator-btn" class="btn">지표</button>
        <div id="indicator-menu" class="menu-panel" hidden></div>
      </div>
      <div class="spacer"></div>
      <button id="screenshot-btn" class="btn icon" title="스크린샷 저장">📷</button>
      <button id="theme-btn" class="btn icon" title="테마 전환">☀</button>
    </header>

    <main class="layout">
      <nav class="tools" aria-label="그리기 도구">
        <button class="tool active" data-tool="cursor" title="십자선">✛</button>
        <button class="tool" data-tool="hline" title="수평선 (클릭해서 추가)">―</button>
        <button class="tool" data-tool="clear" title="그린 선 모두 삭제">🗑</button>
      </nav>

      <section class="chart-wrap">
        <div id="legend" class="legend"></div>
        <div id="chart" class="chart"></div>
        <div id="loading" class="loading" hidden>불러오는 중…</div>
      </section>

      <aside class="watchlist">
        <div class="watch-head">
          <span id="watch-title">관심 목록</span>
        </div>
        <div class="watch-cols"><span>심볼</span><span>가격</span><span>변동</span></div>
        <ul id="watch-list"></ul>
      </aside>
    </main>

    <footer class="statusbar">
      <span><span id="feed-status"></span> <button id="key-btn" class="link" hidden>API 키 설정</button></span>
      <span id="clock"></span>
    </footer>

    <dialog id="search-dialog" class="search">
      <input id="search-input" type="text" placeholder="종목 검색 (코드나 이름)" autocomplete="off" />
      <div id="search-count" class="search-count"></div>
      <ul id="search-results"></ul>
    </dialog>

    <dialog id="key-dialog" class="search key">
      <form id="key-form">
        <h2><span id="key-feed"></span> API 키</h2>
        <p>주식·환율·지수 시세는 Twelve Data의 무료 키가 있어야 받을 수 있습니다.
          <a href="https://twelvedata.com/register" target="_blank" rel="noopener">twelvedata.com</a>에 가입한 뒤
          대시보드의 API Keys에서 키를 복사해 붙여 넣으세요.</p>
        <p class="hint">키는 이 브라우저에만 저장되고 다른 곳으로 보내지 않습니다. 무료 한도는 분당 8회, 하루 800회라서 차트는 2분, 관심 목록은 5분마다 새로 고칩니다.</p>
        <input id="key-input" type="text" placeholder="API 키" autocomplete="off" spellcheck="false" required />
        <div class="actions">
          <button type="button" id="key-cancel" class="btn">취소</button>
          <button type="submit" class="btn primary">저장</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
